<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#235A98">
  <meta name="description" content="HLU TOOLS - Kết nối, Chia sẻ, Hiệu quả">
  <link rel="manifest" href="/hlu/manifest.webmanifest">
  <link rel="icon" href="/hlu/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/hlu/assets/app.css">
  <title>HLU TOOLS</title>
</head>
<body>
<div id="app">
  <header class="app-header">
    <button id="menuBtn" class="menu-button" aria-label="Mở menu"><i></i><i></i><i></i></button>
    <div class="header-brand">
      <img src="/hlu/assets/logo.svg" alt="HLU TOOLS">
      <div><strong>HLU TOOLS</strong><small>Kết nối - Chia sẻ - Hiệu quả</small></div>
    </div>
    <span class="header-spacer"></span>
  </header>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-brand">
      <img src="/hlu/assets/logo.svg" alt="">
      <strong>HLU TOOLS</strong>
      <small>Kết nối - Chia sẻ - Hiệu quả</small>
    </div>
    <nav>
      <button data-view="home"><span>⌂</span>Trang chủ</button>
      <button data-section="news"><span>▤</span>Tin tức</button>
      <button data-view="search"><span>⌕</span>Tìm kiếm</button>
      <button data-view="notifications"><span>♢</span>Thông báo</button>
      <button data-view="saved"><span>☆</span>Đã lưu</button>
      <button data-view="downloads"><span>⇩</span>Download</button>
      <button data-view="settings"><span>⚙</span>Cài đặt</button>
    </nav>
    <footer>Copyright © 2026 - Cường VNPT</footer>
  </aside>
  <div id="scrim" class="scrim"></div>

  <main>
    <section id="homeView" class="view active">
      <div id="offlineBanner" class="offline hidden">Đang sử dụng dữ liệu đã lưu ngoại tuyến</div>
      <button id="homeSearch" class="home-search"><span>⌕</span><em>Tìm phần mềm, tài liệu, firmware...</em></button>

      <section class="home-section">
        <div class="section-heading"><h2>TIN TỨC</h2><button data-section="news">Xem tất cả <b>›</b></button></div>
        <div id="newsPreview" class="news-list"></div>
      </section>

      <section class="download-cards" aria-label="Download">
        <button class="download-card soft-card" data-section="soft">
          <span class="visual"><span class="visual-icon">⚙</span><span class="orbit"></span></span>
          <span class="card-copy"><b>SOFT VNPT</b><small>Ứng dụng &amp; công cụ dành cho kỹ thuật</small><em id="softCount">0 mục</em></span><i>›</i>
        </button>
        <button class="download-card docs-card" data-section="docs">
          <span class="visual"><span class="visual-icon">▤</span><span class="orbit"></span></span>
          <span class="card-copy"><b>DOWNLOAD TÀI LIỆU</b><small>Tài liệu hướng dẫn và kỹ thuật</small><em id="docsCount">0 mục</em></span><i>›</i>
        </button>
        <button class="download-card firmware-card" data-section="firmware">
          <span class="visual"><span class="visual-icon">⬡</span><span class="orbit"></span></span>
          <span class="card-copy"><b>DOWNLOAD FIRMWARE</b><small>Firmware thiết bị các hãng</small><em id="firmwareCount">0 mục</em></span><i>›</i>
        </button>
      </section>
    </section>

    <section id="listView" class="view"><div class="page-title"><button class="back">‹</button><h1 id="listTitle">Danh mục</h1><span></span></div><div id="sectionList" class="item-list"></div></section>
    <section id="searchView" class="view"><div class="page-title centered"><span></span><h1>Tìm kiếm</h1><span></span></div><label class="search-input"><span>⌕</span><input id="searchInput" placeholder="Tìm phần mềm, tài liệu, firmware..." autocomplete="off"></label><div id="searchList" class="item-list"></div></section>
    <section id="notificationsView" class="view"><div class="page-title centered"><span></span><h1>Thông báo</h1><button id="markRead">Đã đọc</button></div><div id="notificationList" class="item-list"></div></section>
    <section id="savedView" class="view"><div class="page-title centered"><span></span><h1>Đã lưu</h1><span></span></div><div id="savedList" class="item-list"></div></section>
    <section id="downloadsView" class="view"><div class="page-title centered"><span></span><h1>Download</h1><button id="clearDownloads">Xóa</button></div><div id="downloadList" class="item-list"></div></section>
    <section id="settingsView" class="view"><div class="page-title"><button class="back">‹</button><h1>Cài đặt</h1><span></span></div>
      <div class="settings-list">
        <button id="notifyBtn"><span>Thông báo bài viết mới</span><i>›</i></button>
        <a href="https://www.facebook.com/" target="_blank" rel="noopener"><span>Facebook</span><i>›</i></a>
        <a href="#" id="zaloLink"><span>Zalo</span><i>›</i></a>
        <a href="tel:"><span>Điện thoại</span><i>›</i></a>
        <div><span>Đơn vị</span><b>VNPT Hoa Lư</b></div>
        <div><span>Thông tin phiên bản</span><b>130926</b></div>
      </div>
      <div class="api-box"><label for="apiInput">URL Google Apps Script</label><input id="apiInput" type="url" placeholder="https://script.google.com/macros/s/.../exec"><button id="saveApi">Lưu và đồng bộ</button></div>
    </section>
    <section id="detailView" class="view"><div class="page-title"><button class="back">‹</button><h1>Chi tiết</h1><button id="saveDetail" class="star">☆</button></div><article id="detail"></article></section>
  </main>

  <nav class="bottom-nav">
    <button data-view="home" class="active"><span>⌂</span><small>Trang chủ</small></button>
    <button data-view="search"><span>⌕</span><small>Tìm kiếm</small></button>
    <button data-view="notifications" class="notify-tab"><span>♢</span><i id="notifyBadge" class="hidden">0</i><small>Thông báo</small></button>
    <button data-view="saved"><span>☆</span><small>Đã lưu</small></button>
    <button data-view="downloads"><span>⇩</span><small>Download</small></button>
  </nav>
  <div id="toast" class="toast"></div>
</div>
<script src="/hlu/assets/config.js"></script>
<script src="/hlu/assets/app.js"></script>
</body>
</html>
