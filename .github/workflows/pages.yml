name: Deploy HLU TOOLS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Package source
        run: zip -r HLU_TOOLS_GITHUB_PAGES_HLU.zip . -x '.git/*' 'node_modules/*' 'dist/*' 'HLU_TOOLS_GITHUB_PAGES_HLU.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: HLU_TOOLS_GITHUB_PAGES_HLU
          path: HLU_TOOLS_GITHUB_PAGES_HLU.zip
          retention-days: 90
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
