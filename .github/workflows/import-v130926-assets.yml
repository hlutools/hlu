name: Preview Android 130926 assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-v130926-assets.yml"

permissions:
  contents: write

jobs:
  preview-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create review previews
        run: |
          set -euo pipefail
          mkdir -p assets/android-v130926/previews
          ffmpeg -hide_banner -loglevel error -y -i assets/android-v130926/home-header.png -vf "scale=960:-2" assets/android-v130926/previews/home-header.png
          ffmpeg -hide_banner -loglevel error -y -i assets/android-v130926/drawer-header.png -vf "scale=480:-2" assets/android-v130926/previews/drawer-header.png
          ffmpeg -hide_banner -loglevel error -y -i assets/android-v130926/search-header.png -vf "scale=960:-2" assets/android-v130926/previews/search-header.png
          ffmpeg -hide_banner -loglevel error -y -i assets/android-v130926/saved-header.png -vf "scale=960:-2" assets/android-v130926/previews/saved-header.png
          ffmpeg -hide_banner -loglevel error -y -i assets/android-v130926/notifications-header.png -vf "scale=960:-2" assets/android-v130926/previews/notifications-header.png
          ffmpeg -hide_banner -loglevel error -y -i assets/android-v130926/downloads-header.png -vf "scale=960:-2" assets/android-v130926/previews/downloads-header.png

      - name: Commit previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/android-v130926/previews
          git diff --cached --quiet && exit 0
          git commit -m "Add temporary Android 130926 review previews"
          git push
