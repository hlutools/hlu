name: Build and deploy HLU TOOLS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hlu-tools-pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Web/PWA 220926.5 source and assets
        run: npm test
      - name: Build static GitHub Pages site
        run: npm run build
      - name: Upload downloadable source package
        uses: actions/upload-artifact@v7
        with:
          name: HLU_TOOLS_GITHUB_PAGES_HLU
          path: |
            .
            !.git/**
            !node_modules/**
            !dist/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
